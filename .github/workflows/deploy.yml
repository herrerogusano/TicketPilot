name: Release demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketpilot-demo-release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/master' && vars.TICKETPILOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment authorization
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Confirm current release head before remote writes
        env:
          RELEASE_READ_TOKEN: ${{ github.token }}
        run: >-
          node --input-type=module -e
          "const response = await fetch('https://api.github.com/repos/herrerogusano/TicketPilot/git/ref/heads/master', {headers: {Authorization: 'Bearer ' + process.env.RELEASE_READ_TOKEN, Accept: 'application/vnd.github+json'}, signal: AbortSignal.timeout(8000)});
          const result = await response.json();
          if (!response.ok || result.object?.sha !== process.env.GITHUB_SHA) {console.error('Stale or unverifiable release: no remote writes permitted.'); process.exit(1);}
          console.log('Current release head verified before remote writes.');"
      - name: Apply remote migrations with redacted provider logs
        shell: bash
        run: |
          set -o pipefail
          npm run db:migrate:remote 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email redacted]/g'
      - name: Deploy with redacted provider logs
        shell: bash
        run: |
          set -o pipefail
          npm run deploy 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email redacted]/g'
      - name: Verify deployed health
        run: >-
          node --input-type=module -e
          "const response = await fetch('https://ticketpilot-api.herrerogusano-ticketpilot.workers.dev/health', {signal: AbortSignal.timeout(8000)});
          const result = await response.json();
          if (!response.ok || result.ok !== true || result.configured !== true) process.exit(1);
          console.log('Deployed health verified; application/human acceptance remains separate.');"
