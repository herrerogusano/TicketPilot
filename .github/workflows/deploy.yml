name: Release demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketpilot-demo-release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/master' && vars.TICKETPILOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment authorization
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm run db:migrate:remote
      - run: npm run deploy
      - name: Verify deployed health
        run: >-
          node --input-type=module -e
          "const response = await fetch('https://ticketpilot-api.herrerogusano-ticketpilot.workers.dev/health', {signal: AbortSignal.timeout(8000)});
          const result = await response.json();
          if (!response.ok || result.ok !== true || result.configured !== true) process.exit(1);
          console.log('Deployed health verified; application/human acceptance remains separate.');"
